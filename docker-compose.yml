services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ivolve
      MYSQL_USER: ivolve
      MYSQL_PASSWORD: ivolve_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ivolve
      DB_PASSWORD: ivolve_password
      DB_NAME: ivolve
    depends_on:
      mysql:
        condition: service_healthy

  roadmap-service:
    build: ./roadmap-service

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:5000
      ROADMAP_SERVICE_URL: http://roadmap-service:8080
      SESSION_SECRET: ivolve-local-secret
    depends_on:
      - auth-service
      - roadmap-service

volumes:
  mysql_data:
