apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ivolve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: cloud-devops-frontend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ivolve-config
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ivolve-secret
                  key: SESSION_SECRET
