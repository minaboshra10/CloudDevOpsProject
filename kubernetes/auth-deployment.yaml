apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ivolve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 746491202405.dkr.ecr.us-east-1.amazonaws.com/cloud_devops/auth-service:2
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ivolve-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivolve-secret
                  key: DB_PASSWORD
