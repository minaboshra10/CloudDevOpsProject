plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

profile: clouddevops

filters:
  tag:Project: cloud_devops
  tag:Role: jenkins
  instance-state-name: running

hostnames:
  - instance-id

compose:
  ansible_host: public_ip_address
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: "lookup('env', 'HOME') + '/.ssh/clouddevops-jenkins'"
