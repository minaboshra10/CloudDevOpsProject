---
- name: Install required packages for Trivy
  ansible.builtin.apt:
    name:
      - wget
      - apt-transport-https
      - gnupg
    state: present
    update_cache: true

- name: Add Trivy GPG key
  ansible.builtin.get_url:
    url: https://aquasecurity.github.io/trivy-repo/deb/public.key
    dest: /usr/share/keyrings/trivy.asc
    mode: "0644"

- name: Add Trivy APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/trivy.asc] https://aquasecurity.github.io/trivy-repo/deb generic main"
    filename: trivy
    state: present
    update_cache: true

- name: Install Trivy
  ansible.builtin.apt:
    name: trivy
    state: present
